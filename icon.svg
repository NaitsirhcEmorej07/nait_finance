<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Ribbon Gradients -->
    <linearGradient id="leftPillar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="diagonalRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="rightPillar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>

    <filter id="sparkle" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="118" fill="url(#ambientGlow)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Subtle Concentric Grid Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>

  <!-- Main Monogram "N" Ribbon with 3D Fold & FinTech Growth Surge -->
  <g filter="url(#glow)">
    <!-- Left Pillar (Solid Emerald Pillar) -->
    <path d="M 138 368 L 138 184 C 138 162 156 144 178 144 C 200 144 218 162 218 184 L 218 368 C 218 390 200 408 178 408 C 156 408 138 390 138 368 Z"
          fill="url(#leftPillar)"/>

    <!-- Diagonal Dynamic Weave -->
    <path d="M 178 144 L 334 340 C 342 350 355 356 368 356 C 378 356 386 352 392 346 L 222 134 C 214 124 201 118 188 118 C 174 118 162 126 156 138 Z"
          fill="url(#diagonalRibbon)"/>

    <!-- Right Pillar with Ascending Arrow Surge -->
    <path d="M 294 328 L 294 144 C 294 122 312 104 334 104 C 356 104 374 122 374 144 L 374 328 C 374 350 356 368 334 368 C 312 368 294 350 294 328 Z"
          fill="url(#rightPillar)"/>

    <!-- Growth Node / Ascending Arrow Tip on Right Pillar -->
    <path d="M 334 76 L 368 122 L 300 122 Z" fill="#6ee7b7"/>
  </g>

  <!-- Spark of Wealth / Growth Star in Top-Right -->
  <g filter="url(#sparkle)" transform="translate(382, 92)">
    <path d="M 0 -22 C 2 -7 7 -2 22 0 C 7 2 2 7 0 22 C -2 7 -7 2 -22 0 C -7 -2 -2 -7 0 -22 Z" fill="url(#goldSpark)"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>
</svg>
